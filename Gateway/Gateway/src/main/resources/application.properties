spring.application.name=Gateway
server.port=8084


#Eureka

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.serviceURL.defaultZone = http://localhost:8761/eureka/



# Zipkin
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.zipkin.tracing.export.enabled=true


#Gateway
# Job Service
spring.cloud.gateway.server.webmvc.routes[0].id=job-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://JOB-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/jobs/**

# Company Service
spring.cloud.gateway.server.webmvc.routes[1].id=company-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://COMPANY-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/companies/**

# Review Service
spring.cloud.gateway.server.webmvc.routes[2].id=review-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/reviews/**

#eureka server
spring.cloud.gateway.server.webmvc.routes[3].id=eureka-server
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8761
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/eureka/main
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=setPath=/

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE


management.endpoints.web.exposure.include=*