spring.application.name=job-service
server.port=8081

job-service.url=http://jobms:8081
company-service.url=http://companyms:8082
review-service.url=http://reviewms:8083


# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/job
spring.datasource.username=embarkx
spring.datasource.password=embarkx

spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# Eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://servicereg:8761/eureka/

# Zipkin
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://zipkin:9411/api/v2/spans

#config server
spring.config.import=optional:configserver:http://config-server-ms:8080

#actuator

management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.companyBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.companyBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.companyBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.companyBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.companyBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.companyBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.companyBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.companyBreaker.sliding-window-type=COUNT_BASED


# Retry Configuration
resilience4j.retry.instances.companyRetry.max-attempts=5
resilience4j.retry.instances.companyRetry.wait-duration=2s

#RateLimiter Configuration

resilience4j.ratelimiter.instances.companyLimiter.timeout-duration=0
resilience4j.ratelimiter.instances.companyLimiter.limit-refresh-period=4
resilience4j.ratelimiter.instances.companyLimiter.limit-for-period=2


